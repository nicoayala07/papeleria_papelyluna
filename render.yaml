databases:
  - name: papeleria-db
    plan: free

services:
  - type: web
    name: papeleria-papelyluna
    runtime: node
    plan: free
    buildCommand: "npm install && npm run db:migrate"
    startCommand: "npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: papeleria-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
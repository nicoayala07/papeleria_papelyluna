<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Papelería Papelyluna</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/styles.css">
</head>
<body>

    <!-- ENCABEZADO -->
    <header class="header">
        <div class="header__logo">
            <span class="header__logo-icon">🌙</span>
            <span class="header__logo-text">Papel y Luna</span>
        </div>
        <nav class="header__nav">
            <span class="header__nav-item">Inicio</span>
            <span class="header__nav-item">Catálogo</span>
            <span class="header__nav-item">Contacto</span>
        </nav>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="main-container">

        <!-- SECCIÓN DE PRODUCTOS -->
        <section class="products-section">

            <!-- ENCABEZADO DEL CATÁLOGO -->
            <div class="products-header">
                <h2 class="products-title">Catálogo de Productos</h2>

                <div class="filters">
                    <!-- BÚSQUEDA POR NOMBRE -->
                    <div class="filter-search">
                        <span class="filter-search__icon">🔍</span>
                        <input
                            type="text"
                            id="search-input"
                            placeholder="Buscar producto..."
                            class="filter-input"
                        >
                    </div>

                    <!-- FILTRO POR CATEGORÍA -->
                    <select id="category-filter" class="filter-select">
                        <option value="">Todas las categorías</option>
                        <option value="cuadernos">Cuadernos</option>
                        <option value="bolígrafos">Bolígrafos</option>
                        <option value="papel">Papel</option>
                        <option value="materiales de arte">Materiales de arte</option>
                    </select>
                </div>
            </div>

            <!-- CONTENEDOR DINÁMICO DE PRODUCTOS -->
            <div class="products-grid" id="products-container">
                <!-- Productos renderizados dinámicamente desde JS -->
            </div>
        </section>

        <!-- SIDEBAR - CARRITO DE COMPRAS -->
        <aside class="sidebar">
            <section class="shopping-cart">

                <!-- TÍTULO DEL CARRITO -->
                <div class="cart__header">
                    <h2 class="cart__title">Carrito de Compras</h2>
                    <span class="cart__icon">🛒</span>
                </div>

                <!-- CONTENEDOR DINÁMICO DEL CARRITO -->
                <div class="cart__items" id="cart-container">
                    <div class="cart__empty" id="empty-cart-message">
                        <span class="cart__empty-icon">🛒</span>
                        <p class="cart__empty-title">Tu carrito está vacío</p>
                        <p class="cart__empty-subtitle">¡Agrega productos desde el catálogo!</p>
                    </div>
                </div>

                <!-- RESUMEN DEL CARRITO -->
                <div class="cart__summary">
                    <div class="summary__row">
                        <span>Subtotal:</span>
                        <span class="summary__value" id="subtotal">$0.00</span>
                    </div>
                    <div class="summary__row">
                        <span>Envío:</span>
                        <span class="summary__value" id="shipping">$0.00</span>
                    </div>
                    <div class="summary__row summary__row--total">
                        <span>Total:</span>
                        <span class="summary__value summary__value--total" id="total">$0.00</span>
                    </div>
                </div>

                <!-- BOTONES DE ACCIÓN -->
                <div class="cart__actions">
                    <button class="btn btn--danger" id="vaciar-btn">🗑 Vaciar Carrito</button>
                    <button class="btn btn--success" id="checkout-btn">Finalizar Compra ›</button>
                </div>

            </section>
        </aside>
    </main>
